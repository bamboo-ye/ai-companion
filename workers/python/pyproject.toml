[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-companion-worker"
version = "0.1.0"
description = "Isolated document, spreadsheet, finance, and media worker for 伴AI."
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.0",
  "opencc-python-reimplemented==0.1.7",
  "openpyxl==3.1.5",
  "pymupdf==1.28.2",
  "pypdf==6.14.2",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "reportlab==4.4.2",
  "tiktoken==0.13.0",
]

[project.optional-dependencies]
document = ["docling==2.119.0"]
agent = [
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
  "psycopg[binary,pool]==3.3.4",
]
dev = ["mypy>=1.16", "pytest>=8.4", "ruff>=0.12"]

[project.scripts]
ai-companion-python-worker = "ai_companion_worker.main:main"
ai-companion-agent-checkpoint = "ai_companion_worker.agent_checkpoint:main"
ai-companion-agent-run = "ai_companion_worker.agent_worker:main"
ai-companion-deployment-scheduler = "ai_companion_worker.evaluation.deployment_scheduler_service:main"
ai-companion-deployment-shadow = "ai_companion_worker.evaluation.deployment_shadow:main"
ai-companion-deployment-shadow-gate = "ai_companion_worker.evaluation.deployment_shadow_gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
