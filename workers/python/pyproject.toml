[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-companion-worker"
version = "0.1.0"
description = "Isolated document, spreadsheet, finance, and media worker for 伴AI."
requires-python = ">=3.12"
dependencies = [
  "openpyxl==3.1.5",
  "pypdf==6.14.2",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
]

[project.optional-dependencies]
dev = ["mypy>=1.16", "pytest>=8.4", "ruff>=0.12"]

[project.scripts]
ai-companion-python-worker = "ai_companion_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
