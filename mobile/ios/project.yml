name: AICompanion
options:
  bundleIdPrefix: com.aicompanion
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
packages:
  CompanionCore:
    path: .
targets:
  AICompanion:
    type: application
    platform: iOS
    sources:
      - path: CompanionApp
    dependencies:
      - package: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicompanion.app
        INFOPLIST_KEY_CFBundleDisplayName: 伴AI
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: 伴AI 需要访问提醒事项，以便按你的确认创建和同步提醒。
        GENERATE_INFOPLIST_FILE: YES

