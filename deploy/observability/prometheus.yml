global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prometheus-rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets:
          - api:8080

  - job_name: agent-worker
    static_configs:
      - targets:
          - agent-worker:9467
