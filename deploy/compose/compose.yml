name: ai-companion

services:
  mysql:
    profiles: ["mysql"]
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_companion}
      POSTGRES_USER: ${POSTGRES_USER:-ai_companion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-postgres-me}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    profiles: ["kafka-scale"]
    image: apache/kafka:4.3.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Opening the broker socket avoids starting a JVM for every probe.
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  kafka-init:
    profiles: ["kafka-scale"]
    image: apache/kafka:4.3.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in chat.command.v1 agent.run.requested.v1 agent.run.resume.requested.v1 memory.extract.v1 document.ingest.v1 document.cleanup.v1 skill.execute.v1 skill.run.succeeded.v1 skill.run.failed.v1 skill.run.cancelled.v1 ledger.entry.created.v1 ledger.export.v1 reminder.confirmed.v1 reminder.rescheduled.v1 notification.deliver.v1 email.deliver.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["mysql"]
    image: ai-companion-migrate:local
    build:
      context: ../..
      dockerfile: deploy/docker/migrate.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    environment:
      MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=UTC"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  migrate-postgres:
    profiles: ["postgres", "app", "agent"]
    image: ai-companion-migrate:local
    build:
      context: ../..
      dockerfile: deploy/docker/migrate.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    environment:
      DATABASE_DRIVER: postgres
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-ai_companion}:${POSTGRES_PASSWORD:-change-postgres-me}@postgres:5432/${POSTGRES_DB:-ai_companion}?sslmode=disable"
      MIGRATIONS_DIR: migrations/postgres
      MIGRATION_REQUIRED_TABLES: agent.runs,app.users,app.conversations,app.long_term_memories,app.ledger_entries,app.reminders,app.notification_deliveries,app.documents,app.skill_runs,app.generated_files,app.workspaces,app.email_deliveries,app.billing_plans,app.user_safety_policies,app.operator_accounts,eventing.outbox_events
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-postgres-data:
    profiles: ["postgres-data"]
    image: ai-companion-migrate:local
    build:
      context: ../..
      dockerfile: deploy/docker/migrate.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    entrypoint: ["/migrate-core-data"]
    environment:
      MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=UTC"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-ai_companion}:${POSTGRES_PASSWORD:-change-postgres-me}@postgres:5432/${POSTGRES_DB:-ai_companion}?sslmode=disable"
      CORE_DATA_MIGRATION_MODE: ${CORE_DATA_MIGRATION_MODE:-copy}
      DATA_MIGRATION_SCOPE: ${DATA_MIGRATION_SCOPE:-core}
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  postgres-store-test:
    profiles: ["postgres-test"]
    image: ai-companion-postgres-store-test:local
    build:
      context: ../..
      dockerfile: deploy/docker/postgres-test.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    environment:
      POSTGRES_TEST_DSN: "postgres://${POSTGRES_USER:-ai_companion}:${POSTGRES_PASSWORD:-change-postgres-me}@postgres:5432/${POSTGRES_DB:-ai_companion}?sslmode=disable"
    depends_on:
      migrate-postgres:
        condition: service_completed_successfully
    restart: "no"

  agent-checkpoint-setup:
    profiles: ["agent"]
    image: ai-companion-agent:local
    build:
      context: ../..
      dockerfile: deploy/docker/agent.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    entrypoint: ["ai-companion-agent-checkpoint"]
    environment:
      LANGGRAPH_STRICT_MSGPACK: "true"
      LANGGRAPH_POSTGRES_DSN: "postgres://${POSTGRES_USER:-ai_companion}:${POSTGRES_PASSWORD:-change-postgres-me}@postgres:5432/${POSTGRES_DB:-ai_companion}?sslmode=disable&options=-csearch_path%3Dlanggraph%2Cpublic"
    depends_on:
      migrate-postgres:
        condition: service_completed_successfully
    restart: "no"

  agent-worker:
    profiles: ["agent-runtime"]
    image: ai-companion-agent:local
    build:
      context: ../..
      dockerfile: deploy/docker/agent.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    env_file:
      - ../../.env
    environment:
      APP_DATABASE_DRIVER: postgres
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-ai_companion}:${POSTGRES_PASSWORD:-change-postgres-me}@postgres:5432/${POSTGRES_DB:-ai_companion}?sslmode=disable"
      LANGGRAPH_POSTGRES_DSN: "postgres://${POSTGRES_USER:-ai_companion}:${POSTGRES_PASSWORD:-change-postgres-me}@postgres:5432/${POSTGRES_DB:-ai_companion}?sslmode=disable&options=-csearch_path%3Dlanggraph%2Cpublic"
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      AGENT_GATEWAY_URL: http://api:8080
      AGENT_GATEWAY_TOKEN: ${AGENT_GATEWAY_TOKEN:-development-agent-gateway-token}
      PYTHON_EXECUTABLE: /usr/local/bin/python
      PYTHON_WORKER_PATH: /app/workers/python/src
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
      AGENT_METRICS_ADDR: :9467
    ports:
      - "127.0.0.1:${AGENT_METRICS_PORT:-9467}:9467"
    depends_on:
      agent-checkpoint-setup:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
        required: false
      api:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9467/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus-rules.yml:/etc/prometheus/rules/prometheus-rules.yml:ro
    restart: unless-stopped

  deployment-sandbox-setup:
    profiles: ["deployment-sandbox"]
    image: ai-companion-agent:local
    build:
      context: ../..
      dockerfile: deploy/docker/agent.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    entrypoint: ["python", "-m", "ai_companion_worker.evaluation.deployment_scheduler"]
    command:
      - initialize-sandbox
      - --ledger
      - /app/.scheduler/controller/ledger.sqlite3
      - --provider-ledger
      - /app/.scheduler/provider/provider.sqlite3
      - --output-dir
      - /app/.scheduler/certifications
      - --nonce
      - ${OBSERVABILITY_ADAPTER_CERTIFICATION_NONCE:-local-sandbox-v1}
      - --ttl-seconds
      - ${OBSERVABILITY_ADAPTER_CERTIFICATION_TTL:-3600}
    environment:
      OBSERVABILITY_ADAPTER_CERTIFICATION_KEY: ${OBSERVABILITY_ADAPTER_CERTIFICATION_KEY:-}
      OBSERVABILITY_ADAPTER_CERTIFICATION_KEY_ID: ${OBSERVABILITY_ADAPTER_CERTIFICATION_KEY_ID:-}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - deployment-scheduler-data:/app/.scheduler
    security_opt:
      - no-new-privileges:true
    restart: "no"

  deployment-sandbox-scheduler:
    profiles: ["deployment-sandbox"]
    image: ai-companion-agent:local
    build:
      context: ../..
      dockerfile: deploy/docker/agent.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    entrypoint: ["ai-companion-deployment-scheduler"]
    command:
      - --ledger
      - /app/.scheduler/controller/ledger.sqlite3
      - --provider-ledger
      - /app/.scheduler/provider/provider.sqlite3
      - --certification-dir
      - /app/.scheduler/certifications
      - --certification-nonce
      - ${OBSERVABILITY_ADAPTER_CERTIFICATION_NONCE:-local-sandbox-v1}
      - --state-dir
      - /app/.scheduler/service
      - --interval-seconds
      - ${OBSERVABILITY_DEPLOYMENT_SCHEDULER_INTERVAL:-5}
      - --limit
      - ${OBSERVABILITY_RECONCILIATION_BATCH_LIMIT:-100}
      - --lease-seconds
      - ${OBSERVABILITY_DEPLOYMENT_LEASE:-30}
      - --max-consecutive-failures
      - ${OBSERVABILITY_DEPLOYMENT_SCHEDULER_MAX_FAILURES:-3}
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "9465"
    environment:
      OBSERVABILITY_ADAPTER_CERTIFICATION_KEY: ${OBSERVABILITY_ADAPTER_CERTIFICATION_KEY:-}
      OBSERVABILITY_ADAPTER_CERTIFICATION_KEY_ID: ${OBSERVABILITY_ADAPTER_CERTIFICATION_KEY_ID:-}
    ports:
      - "127.0.0.1:${OBSERVABILITY_DEPLOYMENT_SCHEDULER_PORT:-9465}:9465"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - deployment-scheduler-data:/app/.scheduler
    depends_on:
      deployment-sandbox-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9465/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    restart: "on-failure:3"

  deployment-shadow:
    profiles: ["deployment-shadow"]
    image: ai-companion-agent:local
    build:
      context: ../..
      dockerfile: deploy/docker/agent.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    entrypoint: ["ai-companion-deployment-shadow"]
    command:
      - --ledger
      - /app/.scheduler-source/controller/ledger.sqlite3
      - --state-dir
      - /app/.shadow/state
      - --history-ledger
      - /app/.shadow/history/history.sqlite3
      - --provider-name
      - ${OBSERVABILITY_SHADOW_PROVIDER_NAME:-}
      - --provider-base-url
      - ${OBSERVABILITY_SHADOW_PROVIDER_BASE_URL:-}
      - --allowed-host
      - ${OBSERVABILITY_SHADOW_PROVIDER_ALLOWED_HOST:-}
      - --provider-instance
      - ${OBSERVABILITY_SHADOW_PROVIDER_INSTANCE:-}
      - --timeout-seconds
      - ${OBSERVABILITY_SHADOW_PROVIDER_TIMEOUT:-5}
      - --max-attempts
      - ${OBSERVABILITY_SHADOW_PROVIDER_MAX_ATTEMPTS:-2}
      - --retry-base-seconds
      - ${OBSERVABILITY_SHADOW_PROVIDER_RETRY_BASE:-0.25}
      - --interval-seconds
      - ${OBSERVABILITY_SHADOW_INTERVAL:-30}
      - --limit
      - ${OBSERVABILITY_SHADOW_LIMIT:-100}
      - --max-consecutive-failures
      - ${OBSERVABILITY_SHADOW_MAX_FAILURES:-3}
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "9466"
    environment:
      OBSERVABILITY_SHADOW_PROVIDER_TOKEN: ${OBSERVABILITY_SHADOW_PROVIDER_TOKEN:-}
    ports:
      - "127.0.0.1:${OBSERVABILITY_SHADOW_PORT:-9466}:9466"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - deployment-scheduler-data:/app/.scheduler-source:ro
      - deployment-shadow-data:/app/.shadow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9466/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "on-failure:3"

  api:
    profiles: ["app"]
    image: ai-companion-api:local
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
        SERVICE: api
        VERSION: local
    env_file:
      - ../../.env
    environment:
      API_HTTP_ADDR: :8080
      APP_DATABASE_DRIVER: ${APP_DATABASE_DRIVER:-postgres}
      MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=UTC"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-ai_companion}:${POSTGRES_PASSWORD:-change-postgres-me}@postgres:5432/${POSTGRES_DB:-ai_companion}?sslmode=disable"
      REDIS_ADDR: redis:6379
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      DOCUMENT_STORAGE_DIR: /app/.data/files
      SKILL_STORAGE_DIR: /app/.data/skill-files
      LEDGER_STORAGE_DIR: /app/.data/ledger-exports
      PYTHON_EXECUTABLE: /usr/local/bin/python
      PYTHON_WORKER_PATH: /app/workers/python/src
      SPREADSHEET_EXECUTABLE: /usr/local/bin/python
      SPREADSHEET_WORKER_PATH: /app/workers/python/src/ai_companion_worker/ledger_export.py
      AGENT_GATEWAY_TOKEN: ${AGENT_GATEWAY_TOKEN:-development-agent-gateway-token}
      AGENT_CONFIRMATION_SECRET: ${AGENT_CONFIRMATION_SECRET:-development-agent-confirmation-secret}
      AGENT_CONFIRMATION_TTL: ${AGENT_CONFIRMATION_TTL:-15m}
      AGENT_CHAT_MODULES: ${AGENT_CHAT_MODULES:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app-files:/app/.data/files
      - skill-files:/app/.data/skill-files
      - ledger-exports:/app/.data/ledger-exports
    depends_on:
      migrate-postgres:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
        required: false
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    profiles: ["app"]
    image: ai-companion-worker:local
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
        SERVICE: worker
        VERSION: local
    env_file:
      - ../../.env
    environment:
      APP_DATABASE_DRIVER: ${APP_DATABASE_DRIVER:-postgres}
      MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=true&loc=UTC"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-ai_companion}:${POSTGRES_PASSWORD:-change-postgres-me}@postgres:5432/${POSTGRES_DB:-ai_companion}?sslmode=disable"
      REDIS_ADDR: redis:6379
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      DOCUMENT_STORAGE_DIR: /app/.data/files
      SKILL_STORAGE_DIR: /app/.data/skill-files
      LEDGER_STORAGE_DIR: /app/.data/ledger-exports
      PYTHON_EXECUTABLE: /usr/local/bin/python
      PYTHON_WORKER_PATH: /app/workers/python/src
      SPREADSHEET_EXECUTABLE: /usr/local/bin/python
      SPREADSHEET_WORKER_PATH: /app/workers/python/src/ai_companion_worker/ledger_export.py
    volumes:
      - app-files:/app/.data/files
      - skill-files:/app/.data/skill-files
      - ledger-exports:/app/.data/ledger-exports
    depends_on:
      migrate-postgres:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
        required: false
      qdrant:
        condition: service_started
    restart: unless-stopped

  web:
    profiles: ["app"]
    image: ai-companion-web:local
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Alpine wget is substantially cheaper than cold-starting Node for each probe.
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  kafka-data:
  qdrant-data:
  minio-data:
  app-files:
  skill-files:
  ledger-exports:
  deployment-scheduler-data:
  deployment-shadow-data:
  prometheus-data:
