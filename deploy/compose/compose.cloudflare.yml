services:
  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ""

  tunnel-gateway:
    profiles: ["cloudflare"]
    image: caddy:2.11.4-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    expose:
      - "8081"
    volumes:
      - ../caddy/Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s
    restart: unless-stopped

  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      tunnel-gateway:
        condition: service_healthy
    restart: unless-stopped
