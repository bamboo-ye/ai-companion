      operationId: listOperatorBillingPlanConfiguration
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Lists immutable billing-plan versions and the active deployment for the current environment.
      parameters:
        - { name: key, in: query, required: false, schema: { type: string, maxLength: 96 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Billing-plan configuration history and active deployments.
          content: { application/json: { schema: { $ref: "#/components/schemas/ConfigurationPage" } } }
