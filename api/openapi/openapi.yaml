      operationId: getOperatorRuntimeConfigurationConvergence
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Compares durable heartbeats from API and Agent Worker instances with the currently deployed immutable configuration versions.
      responses:
        "200":
          description: Per-instance configuration convergence and stale-instance summary.
