        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/billing/plans/{config_key}/versions:
    post:
      operationId: createOperatorBillingPlanVersion
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Creates an immutable billing-plan draft. Requires an admin operator.
      parameters:
        - { name: config_key, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9_-]{1,96}$" } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateBillingPlanVersionRequest" } } }
      responses:
        "201":
          description: Draft version created.
          content:
            application/json:
              schema:
                type: object
