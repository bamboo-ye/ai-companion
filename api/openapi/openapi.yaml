        - { name: from, in: query, required: false, description: Must be supplied together with to; overrides range., schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: Must be supplied together with from; overrides range., schema: { type: string, format: date-time } }
      responses:
