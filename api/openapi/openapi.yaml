openapi: 3.1.0
info:
  title: 伴AI API
  version: 1.27.0
  description: M1-M4 platform plus the M6 reliability control plane, governed Agent Studio, unified adjustable usage ledger, multi-instance runtime-configuration convergence, persisted cost and quality analytics with time trends, predictive budget burn and guarded model-switch recommendations, per-budget proactive forecast policies with sample gating, audited human recommendation feedback, revision-bound application and rollback-execution tracking, configurable before/after observation windows, downloadable periodic budget reviews, read-only rollback recommendations and post-rollback verification with acknowledged/closed human disposition, audited budget guardrails, automatic budget incidents with escalation plus email or management-console recovery notifications, baseline anomaly detection, Loki-backed redacted structured system logs with PostgreSQL fallback and Run/Trace correlation, threshold alert evaluation, downloadable incident evidence, durable W3C/OpenTelemetry Trace Context propagation across HTTP, Outbox, Kafka, Go/Python Agent workers and Langfuse, optional fail-open Langfuse LLM/Agent traces with generations, node observations and scores, operator DLQ replay, and compensation records. Every HTTP response includes canonical traceparent and X-Trace-ID correlation headers; clients may send traceparent/tracestate, while X-Trace-ID remains a normalized compatibility input.
servers:
  - url: http://localhost:8080
paths:
  /metrics:
    get:
      operationId: getPrometheusMetrics
      tags: [Platform]
      responses:
        "200":
          description: Prometheus text exposition; deployment must restrict this operational endpoint to the monitoring network.
          content:
            text/plain:
              schema: { type: string }
  /healthz:
    get:
      operationId: getHealth
      tags: [Platform]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      operationId: getReadiness
      tags: [Platform]
      responses:
        "200":
          description: Process can accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Process is draining or a required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /v1/meta:
    get:
      operationId: getServiceMetadata
      tags: [Platform]
      responses:
        "200":
          description: Service and build metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceMetadata"
  /v1/auth/register:
    post:
      operationId: register
      tags: [Identity]
      requestBody:
        required: true
        description: Skill input. Inline DOCX/CSV/XLSX sources use base64, are limited to 700KB, and remain caller-owned; generated Office files are always new copies.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account and initial session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/auth/login:
    post:
      operationId: login
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated session tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Current session revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: All user sessions revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user's account profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/users/me/password:
    post:
      operationId: changeCurrentUserPassword
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      description: Changes the password, keeps the current session active, and revokes all other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed and other sessions revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/billing/me:
    get:
      operationId: getBillingSummary
      tags: [Billing]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current plan, subscription period, and resource usage for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/safety/me:
    get:
      operationId: getSafetyPolicy
      tags: [Safety]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current account-level safety policy for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateSafetyPolicy
      tags: [Safety]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSafetyPolicyRequest" }
      responses:
        "200":
          description: Safety policy updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SafetyPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/characters:
    get:
      operationId: listCharacters
      tags: [Character]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active characters owned by the caller.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Character" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCharacter
      tags: [Character]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterInput" }
      responses:
        "201":
          description: Character and compiled persona created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterWithPersona" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/characters/{character_id}:
    parameters:
      - name: character_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCharacter
      tags: [Character]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Character details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateCharacter
      tags: [Character]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterInput" }
      responses:
        "200":
          description: Updated character and new persona version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterWithPersona" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCharacter
      tags: [Character]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Character soft-deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/characters/{character_id}/persona-versions:
    get:
      operationId: listPersonaVersions
      tags: [Character]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: character_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Immutable compiled persona history.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PersonaVersion" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/conversations:
    get:
      operationId: listConversations
      tags: [Conversation]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Caller conversations ordered by recent activity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
    post:
      operationId: createConversation
      tags: [Conversation]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [character_id]
              properties:
                character_id: { type: string, format: uuid }
      responses:
        "201":
          description: Conversation created.
          content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } }
  /v1/conversations/{conversation_id}:
    parameters:
      - name: conversation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteConversation
      tags: [Conversation]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Conversation soft-deleted and active generation cancelled. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/conversations/{conversation_id}/messages:
    parameters:
      - name: conversation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listMessages
      tags: [Conversation]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: after_sequence
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: after_bubble
          in: query
          description: Bubble cursor within `after_sequence`.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Persisted messages in sequence and bubble order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Message" } }
    post:
      operationId: sendMessage
      tags: [Conversation]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        "202":
          description: Message persisted and exactly one runtime accepted. Modules not cut over return a GenerationJob; Agent-enabled modules return an AgentRun and never create a legacy generation job.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [message, job]
                    properties:
                      message: { $ref: "#/components/schemas/Message" }
                      job: { $ref: "#/components/schemas/GenerationJob" }
                  - type: object
                    required: [message, agent_run, runtime]
                    properties:
                      message: { $ref: "#/components/schemas/Message" }
                      agent_run: { $ref: "#/components/schemas/AgentRun" }
                      runtime: { type: string, const: agent }
  /v1/generation-jobs/{job_id}:
    get:
      operationId: getGenerationJob
      tags: [Generation]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: job_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Current persisted generation state.
          content: { application/json: { schema: { $ref: "#/components/schemas/GenerationJob" } } }
  /v1/agent-runs/{run_id}:
    get:
      operationId: getAgentRun
      tags: [Agent]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: User-owned Agent Run state. Confirmation tokens and internal input are never exposed.
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentRun" } } }
        "404": { description: Run does not exist or belongs to another user. }
  /v1/agent-runs/{run_id}/resolve:
    post:
      operationId: resolveAgentRunApproval
      tags: [Agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
      responses:
        "202":
          description: Approval decision persisted and resume event accepted.
        "200":
          description: Idempotent replay of the same approval decision.
        "409": { description: Run is not waiting for approval or the decision conflicts. }
  /v1/agent-runs/{run_id}/cancel:
    post:
      operationId: cancelAgentRun
      tags: [Agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        "202":
          description: Cancellation persisted. A running worker observes cancel_requested and terminates its executor before finalizing cancelled.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "200":
          description: Idempotent replay after cancellation was already requested or finalized.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "404": { description: Run does not exist or belongs to another user. }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/agent-runs/{run_id}/retry:
    post:
      operationId: retryAgentRun
      tags: [Agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        "202":
          description: A new Agent Run was accepted for the same persisted user message. The failed exchange remains in chat history.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "200":
          description: Idempotent replay of an already accepted retry.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "404": { description: Run does not exist or belongs to another user. }
        "409": { description: Only failed, timed out, or cancelled runs can be retried. }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/generation-jobs/{job_id}/events:
    get:
      operationId: streamGenerationEvents
      tags: [Generation]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after_event_id, in: query, schema: { type: integer, minimum: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200":
          description: SSE stream with accepted, running, bubble, and terminal events.
          content: { text/event-stream: { schema: { type: string } } }
  /v1/generation-jobs/{job_id}/cancel:
    post:
      operationId: cancelGeneration
      tags: [Generation]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: job_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "202": { description: Cancellation requested. }
        "409": { description: Job is already terminal. }
  /v1/generation-jobs/{job_id}/retry:
    post:
      operationId: retryGeneration
      tags: [Generation]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: job_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "202":
          description: New attempt accepted.
          content: { application/json: { schema: { $ref: "#/components/schemas/GenerationJob" } } }
  /v1/presence/heartbeat:
    post:
      operationId: heartbeatPresence
      tags: [Presence]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Current session presence TTL refreshed. }
        "503": { description: Redis presence service unavailable. }
  /v1/presence/me:
    get:
      operationId: getMyPresence
      tags: [Presence]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user online state.
          content:
            application/json:
              schema:
                type: object
                required: [online]
                properties:
                  online: { type: boolean }
  /v1/memories:
    get:
      operationId: listMemories
      tags: [Memory]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active long-term memories owned by the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Memory" } }
    post:
      operationId: createMemory
      tags: [Memory]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 2, maxLength: 2000 }
      responses:
        "201":
          description: Memory created or existing duplicate returned.
          content: { application/json: { schema: { $ref: "#/components/schemas/Memory" } } }
    delete:
      operationId: clearMemories
      tags: [Memory]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: All active memories soft-deleted. }
  /v1/memories/{memory_id}:
    parameters: [{ name: memory_id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: updateMemory
      tags: [Memory]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, minLength: 2, maxLength: 2000 }
                pinned: { type: boolean }
                importance: { type: number, minimum: 0, maximum: 1 }
      responses:
        "200":
          description: Updated memory.
          content: { application/json: { schema: { $ref: "#/components/schemas/Memory" } } }
    delete:
      operationId: deleteMemory
      tags: [Memory]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Memory soft-deleted and no longer recalled. }
  /v1/documents:
    get:
      operationId: listDocuments
      tags: [Document]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active documents owned by the caller.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Document" } }
    post:
      operationId: uploadDocument
      tags: [Document]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: New document stored and queued for ingestion.
          content: { application/json: { schema: { $ref: "#/components/schemas/DocumentUploadResult" } } }
        "200":
          description: Existing active document returned for duplicate content.
          content: { application/json: { schema: { $ref: "#/components/schemas/DocumentUploadResult" } } }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "413": { description: Upload exceeds the configured size limit. }
        "415": { description: File type is unsupported. }
        "422": { description: File failed validation or safety checks. }
  /v1/documents/{document_id}:
    parameters: [{ name: document_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getDocument
      tags: [Document]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Document metadata and current ingestion status.
          content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDocument
      tags: [Document]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Document, pending ingestion, and stored blob removed from active use. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/documents/query:
    post:
      operationId: queryDocuments
      tags: [Document]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentQueryInput" }
      responses:
        "200":
          description: Evidence-grounded result; insufficient evidence returns no citations and does not fabricate an answer.
          content: { application/json: { schema: { $ref: "#/components/schemas/DocumentQueryResult" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ledger/candidates:
    post:
      operationId: createLedgerCandidate
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 2, maxLength: 2000 }
                timezone: { type: string, example: Asia/Shanghai }
      responses:
        "201":
          description: Parsed candidate; no ledger entry exists until explicit confirmation.
          content: { application/json: { schema: { $ref: "#/components/schemas/LedgerCandidate" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ledger/candidates/{candidate_id}/confirm:
    parameters:
      - { name: candidate_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 191 } }
    post:
      operationId: confirmLedgerCandidate
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        "201": { description: Candidate confirmed and exactly one entry created. }
        "200": { description: Prior confirmation returned without creating a duplicate. }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/ledger/entries:
    get:
      operationId: listLedgerEntries
      tags: [Ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: start, in: query, schema: { type: string, format: date-time } }
        - { name: end, in: query, schema: { type: string, format: date-time } }
        - { name: direction, in: query, schema: { type: string, enum: [income, expense] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: Active entries owned by the caller.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } } }
  /v1/ledger/entries/{entry_id}:
    parameters: [{ name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getLedgerEntry
      tags: [Ledger]
