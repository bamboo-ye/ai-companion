      description: Submits a validated version for approval. Agent definitions require a passing evaluation bound to the exact version fingerprint. Requires an admin operator.
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Version submitted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version]
                properties: { version: { $ref: "#/components/schemas/ConfigurationVersion" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/ops/config-versions/{version_id}/publish:
    post:
      operationId: publishOperatorConfigurationVersion
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Publishes a submitted version. Agent definitions recheck their fingerprint-bound evaluation and, when replacing an active version, atomically require and promote a passing online Canary. Requires a different admin from the author/submitter and verified MFA.
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Operator-TOTP, in: header, required: true, schema: { type: string, pattern: "^\\d{6}$" } }
      responses:
        "200":
          description: Version published and runtime activation status returned.
          content: { application/json: { schema: { $ref: "#/components/schemas/ConfigurationPublishResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/release-readiness:
    get:
      operationId: getReleaseReadiness
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      responses:
        "200":
          description: Admin-only release readiness checklist for production/internal release gates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseReadiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/ops/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      parameters:
        - { name: actor_type, in: query, required: false, schema: { type: string, enum: [user, operator, system] } }
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: resource_type, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: resource_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Recent support audit trail entries.
          content:
            application/json:
              schema:
                type: object
                required: [audit_logs]
                properties:
                  audit_logs: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/audit-logs/export:
    get:
      operationId: exportAuditLogs
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv], default: csv } }
        - { name: actor_type, in: query, required: false, schema: { type: string, enum: [user, operator, system] } }
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: resource_type, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: resource_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
      responses:
        "200":
          description: CSV audit log export. Requires an admin operator role.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/compensations:
    get:
      operationId: listCompensationRecords
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      parameters: [{ name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }]
      responses:
        "200":
          description: Recent operator compensation records.
          content:
            application/json:
              schema:
                type: object
                required: [compensations]
                properties:
                  compensations: { type: array, items: { $ref: "#/components/schemas/CompensationRecord" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCompensationRecord
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      parameters:
        - { name: X-Operator-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
        - { name: X-Operator-TOTP, in: header, required: false, schema: { type: string, pattern: "^\\d{6}$" } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCompensationRequest" } } }
      responses:
        "201":
          description: Manual compensation record created.
          content:
            application/json:
              schema:
                type: object
                required: [compensation]
                properties:
                  compensation: { $ref: "#/components/schemas/CompensationRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/skills:
    get:
      operationId: listSkills
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Versioned enabled and disabled Skill manifests.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SkillManifest" } }
  /v1/skills/{skill_name}/settings:
    put:
      operationId: updateSkillSettings
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: skill_name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Effective caller-specific Skill manifest., content: { application/json: { schema: { $ref: "#/components/schemas/SkillManifest" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/skills/{skill_name}/runs:
    post:
      operationId: startSkillRun
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: skill_name, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 191 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input]
              properties:
                input: { type: object, additionalProperties: true }
      responses:
        "201": { description: Side-effect-free Skill completed., content: { application/json: { schema: { $ref: "#/components/schemas/SkillRunEnvelope" } } } }
        "202": { description: Run awaits explicit confirmation or durable Worker execution., content: { application/json: { schema: { $ref: "#/components/schemas/SkillRunEnvelope" } } } }
        "200": { description: Idempotent replay returned the original run., content: { application/json: { schema: { $ref: "#/components/schemas/SkillRunEnvelope" } } } }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/SafetyBlocked" }
        "409": { description: Idempotency key or run-state conflict. }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/skill-runs:
    get:
      operationId: listSkillRuns
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: conversation_id, in: query, schema: { type: string, format: uuid }, description: Return only tasks linked to this conversation. }
      responses:
        "200":
          description: Caller-owned Skill runs and their checkpoints.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SkillRun" } }
  /v1/skill-runs/{run_id}:
    get:
      operationId: getSkillRun
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: run_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Current state, checkpoints, output, errors, and files., content: { application/json: { schema: { $ref: "#/components/schemas/SkillRun" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/skill-runs/{run_id}/confirm:
    post:
      operationId: confirmSkillRun
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 191 } }
      responses:
        "200": { description: Confirmation recorded and the bounded tool execution completed., content: { application/json: { schema: { $ref: "#/components/schemas/SkillRun" } } } }
        "409": { description: Run is not waiting for confirmation or the key conflicts. }
  /v1/skill-runs/{run_id}/cancel:
    post:
      operationId: cancelSkillRun
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 191 } }
      responses:
        "200": { description: Run cancelled without executing a waiting side effect., content: { application/json: { schema: { $ref: "#/components/schemas/SkillRun" } } } }
        "409": { description: Run is already terminal. }
  /v1/skill-runs/{run_id}/retry:
    post:
      operationId: retrySkillRun
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 191 } }
      responses:
        "200": { description: Failed or cancelled run retried with a new attempt checkpoint., content: { application/json: { schema: { $ref: "#/components/schemas/SkillRun" } } } }
        "409": { description: Run is not retryable. }
  /v1/skill-runs/{run_id}/files/{file_id}:
    get:
      operationId: downloadSkillFile
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Caller-owned generated file; source files are never overwritten.
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/intent/route:
    post:
      operationId: routeIntent
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      description: Returns a traceable rule-layer classification and Skill suggestion. This endpoint never executes a Skill or MCP tool.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IntentRouteInput" } } }
      responses:
        "200": { description: Intent, confidence, missing slots, risk, and optional Skill suggestion., content: { application/json: { schema: { $ref: "#/components/schemas/IntentRouteResult" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/mcp/servers:
    get:
      operationId: listMCPServers
      tags: [Skill]
      security: [{ bearerAuth: [] }]
      description: Lists operator-approved MCP server names and tool allowlists. Commands, arguments, and environments are never exposed.
      responses:
        "200":
          description: Configured stdio MCP allowlists; an empty list is the safe default.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MCPServerSummary" } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    operatorBearerAuth:
      type: http
      scheme: bearer
      description: Uses either legacy OPERATOR_TOKEN or an operator account token. When operator MFA is enabled, clients must also send X-Operator-TOTP.
  responses:
    Unauthorized:
      description: Authentication is missing, invalid, expired, or revoked.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Resource already exists.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated operator role lacks permission for the requested action.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PaymentRequired:
      description: Current plan does not include enough quota for the requested resource.
      content: { application/json: { schema: { $ref: "#/components/schemas/QuotaError" } } }
    SafetyBlocked:
      description: Account safety policy blocks the requested risky capability.
      content: { application/json: { schema: { $ref: "#/components/schemas/SafetyCapabilityError" } } }
    ValidationError:
      description: Request failed domain validation.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource was not found in the caller scope.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServiceUnavailable:
      description: The isolated runtime or a required service is temporarily unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    QuotaError:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          additionalProperties: false
          required: [resource, plan_code, used, limit]
          properties:
            resource: { type: string, enum: [documents, skill_runs, workspaces, agent_runs, model_cost_micros] }
            plan_code: { type: string }
            used: { type: integer, minimum: 0 }
            limit: { type: integer }
    BillingLimits:
      type: object
      additionalProperties: false
      required: [documents, skill_runs_per_month, workspaces, agent_runs_per_month, model_cost_micros_monthly]
      properties:
        documents: { type: integer }
        skill_runs_per_month: { type: integer }
        workspaces: { type: integer }
        agent_runs_per_month: { type: integer, description: Monthly Agent Run quota; -1 is unlimited. }
        model_cost_micros_monthly: { type: integer, description: Monthly model-cost quota in USD micros; -1 is unlimited. }
    BillingPlan:
      type: object
      additionalProperties: false
      required: [code, display_name, status, limits]
      properties:
        code: { type: string, enum: [free, pro, team] }
        display_name: { type: string }
        status: { type: string, enum: [active, archived] }
        limits: { $ref: "#/components/schemas/BillingLimits" }
    BillingSubscription:
      type: object
      additionalProperties: false
      required: [plan_code, status, current_period_start, current_period_end]
      properties:
        id: { type: string, format: uuid }
        plan_code: { type: string }
        status: { type: string, enum: [implicit, trialing, active, past_due, cancelled, expired] }
        current_period_start: { type: string, format: date-time }
        current_period_end: { type: string, format: date-time }
        provider: { type: string }
        provider_ref: { type: string }
    BillingUsageItem:
      type: object
      additionalProperties: false
      required: [resource, actual, adjustment, used, limit, remaining]
      properties:
        resource: { type: string, enum: [documents, skill_runs, workspaces, agent_runs, model_cost_micros] }
        actual: { type: integer, minimum: 0, description: Count or model-cost micros derived from immutable source facts. }
        adjustment: { type: integer, description: Sum of append-only manual corrections for the applicable period. }
        used: { type: integer, minimum: 0 }
        limit: { type: integer }
        remaining: { type: integer }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
    BillingSummary:
      type: object
      additionalProperties: false
      required: [plan, subscription, usage]
      properties:
        plan: { $ref: "#/components/schemas/BillingPlan" }
        subscription: { $ref: "#/components/schemas/BillingSubscription" }
        usage: { type: array, items: { $ref: "#/components/schemas/BillingUsageItem" } }
    BillingUsageAdjustment:
      type: object
      additionalProperties: false
      required: [id, user_id, resource, delta, reason, actor, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        resource: { type: string, enum: [documents, skill_runs, workspaces, agent_runs, model_cost_micros] }
        delta: { type: integer, not: { const: 0 } }
        reason: { type: string, minLength: 1, maxLength: 512 }
        actor: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CreateBillingUsageAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [resource, delta, reason]
      properties:
        resource: { type: string, enum: [documents, skill_runs, workspaces, agent_runs, model_cost_micros] }
        delta: { type: integer, not: { const: 0 } }
        reason: { type: string, minLength: 1, maxLength: 512 }
    SafetyPolicy:
      type: object
      additionalProperties: false
      required: [minor_mode, risky_skills_allowed]
      properties:
        minor_mode: { type: boolean }
        guardian_email: { type: string, format: email }
        risky_skills_allowed: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpdateSafetyPolicyRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        minor_mode: { type: boolean }
        guardian_email: { type: string, format: email }
        risky_skills_allowed: { type: boolean }
    SafetyCapabilityError:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          additionalProperties: false
          required: [skill_name, risk_level, minor_mode]
          properties:
            skill_name: { type: string }
            risk_level: { type: string, enum: [medium, high] }
            minor_mode: { type: boolean }
    DeviceInput:
      type: object
      additionalProperties: false
      required: [device_key, name, platform]
      properties:
        device_key: { type: string, maxLength: 191 }
        name: { type: string, maxLength: 120 }
        platform: { type: string, enum: [web, ios, android, service] }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name, timezone, device]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        display_name: { type: string, minLength: 1, maxLength: 40 }
        timezone: { type: string, example: Asia/Shanghai }
        locale: { type: string, default: zh-CN }
        device: { $ref: "#/components/schemas/DeviceInput" }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        timezone: { type: string }
        device: { $ref: "#/components/schemas/DeviceInput" }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 128 }
        new_password: { type: string, minLength: 8, maxLength: 128 }
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, timezone, locale, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        timezone: { type: string }
        locale: { type: string }
        status: { type: string, enum: [active, disabled, deleted] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, access_expires_at, refresh_expires_at, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    CharacterInput:
      type: object
      additionalProperties: false
      description: Empty or omitted persona fields are filled with module-specific defaults during character creation.
      properties:
        module: { type: string, enum: [companion, life, work], default: companion }
        name: { type: string, maxLength: 40, description: Uses the selected module's default name when empty or omitted. }
        avatar_url: { type: string }
        relationship: { type: string }
        personality: { type: string, maxLength: 1000 }
        speech_style: { type: string, maxLength: 500 }
        hobbies: { type: array, maxItems: 20, items: { type: string } }
        boundaries: { type: array, maxItems: 20, items: { type: string } }
        initiative: { type: string, enum: [low, balanced, high], default: balanced }
        reply_length: { type: string, enum: [short, medium, long], default: short }
        sticker_style: { type: string }
        raw_prompt: { type: string, maxLength: 4000 }
    Character:
      allOf:
        - { $ref: "#/components/schemas/CharacterInput" }
        - type: object
          required: [id, module, name, relationship, personality, speech_style, persona_version, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            persona_version: { type: integer, minimum: 1 }
            status: { type: string, enum: [active, disabled, deleted] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PersonaVersion:
      type: object
      required: [character_id, version, compiler_version, compiled, created_at]
      properties:
        character_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        compiler_version: { type: string }
        compiled: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    CharacterWithPersona:
      type: object
      required: [character, persona]
      properties:
        character: { $ref: "#/components/schemas/Character" }
        persona: { $ref: "#/components/schemas/PersonaVersion" }
    Conversation:
      type: object
      required: [id, character_id, title, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        character_id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [active] }
        last_message_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, conversation_id, role, sequence, bubble, content, status, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant, system, tool] }
        sequence: { type: integer, minimum: 1 }
        bubble: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string }
        status: { type: string }
