  /v1/ops/performance/forecast:
    get:
      operationId: getOperatorPerformanceForecast
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Projects each matching budget to the end of its current period using actual burn rate over the selected history window. It also proposes lower-cost observed models only when sample, error-rate, and P95-latency guardrails pass. Recommendations are read-only and require validation before adoption.
      parameters:
        - { name: module, in: query, required: false, schema: { type: string, enum: [companion, life, work] } }
        - { name: range, in: query, required: false, schema: { type: string, enum: [24h, 7d, 30d, 90d], default: 7d } }
        - { name: from, in: query, required: false, description: Must be supplied together with to; overrides range., schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: Must be supplied together with from; overrides range., schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Read-only budget and model optimization forecast.
          content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceForecast" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/performance/budgets:
    get:
      operationId: listOperatorPerformanceBudgets
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Evaluates persisted daily and monthly cost guardrails against actual Agent model-call costs and returns each budget's proactive forecast policy.
      responses:
        "200":
          description: Budget definitions with current-period utilization and status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [budgets]
                properties:
                  budgets: { type: array, items: { $ref: "#/components/schemas/PerformanceBudgetStatus" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createOperatorPerformanceBudget
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Creates one audited budget per module scope and period. Requires the admin role.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceBudgetMutation" } } }
      responses:
        "201":
          description: Budget created.
          content:
            application/json:
              schema:
                type: object
                required: [budget]
                properties: { budget: { $ref: "#/components/schemas/PerformanceBudget" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/performance/budgets/forecast-history:
    get:
      operationId: getOperatorPerformanceBudgetForecastHistory
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Reports outcomes for incidents initially opened by a projected budget exceedance and produces conservative read-only policy recommendations. A hit means the same incident later escalated to an actual exceedance; a cleared prediction may reflect successful mitigation and is not labelled a false positive. Observing predictions are excluded from hit-rate calculations. Recommendations require at least five decided outcomes and must pass impact preview before any manual update. Regressed effects can be acknowledged and closed through separately audited, admin-only endpoints that never update the budget.
      parameters:
        - { name: range, in: query, required: false, schema: { type: string, enum: [30d, 90d, 365d], default: 90d } }
        - { name: budget_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, description: Limits returned detail items only; aggregate values cover the complete selected range., schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Read-only forecast outcome aggregates and recent details.
          content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceBudgetForecastHistory" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/performance/budgets/report:
    get:
      operationId: exportOperatorPerformanceBudgetReview
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Downloads a privacy-safe periodic review containing current budget status, complete forecast outcomes, human decisions, effect observations, rollback plans, and post-rollback verification. It never evaluates budgets or sends notifications.
      parameters:
        - { name: range, in: query, required: false, schema: { type: string, enum: [30d, 90d, 365d], default: 90d } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, markdown], default: json } }
      responses:
        "200":
          description: Downloadable JSON or Markdown budget-review report.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/PerformanceBudgetReviewReport" } }
            text/markdown: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/performance/budgets/evaluate:
    post:
      operationId: evaluateOperatorPerformanceBudgets
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Immediately evaluates every persisted budget and reconciles forecast-warning, actual-warning, critical, escalation, and recovery incident transitions. Each budget controls whether forecast incidents are enabled, the 1-90 day history window, and the 5-10000 completed-run sample minimum. The API also runs this evaluation periodically.
      responses:
        "200":
          description: Budget evaluation and incident-transition counts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [evaluation]
                properties:
                  evaluation: { $ref: "#/components/schemas/PerformanceBudgetEvaluation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/ops/performance/budgets/{budget_id}:
    patch:
      operationId: updateOperatorPerformanceBudget
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Replaces mutable budget fields using an optimistic revision check and records the reason in the audit log. Requires the admin role.
      parameters:
        - { name: budget_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceBudgetMutation" } } }
      responses:
        "200":
          description: Updated budget.
          content:
            application/json:
              schema:
                type: object
                required: [budget]
                properties: { budget: { $ref: "#/components/schemas/PerformanceBudget" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/performance/budgets/{budget_id}/preview:
    post:
      operationId: previewOperatorPerformanceBudgetImpact
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Compares the persisted budget with a proposed complete definition using the same actual-cost and forecast rules as incident evaluation. This admin-only operation is read-only and never saves the budget, reconciles incidents, or sends notifications.
      parameters:
        - { name: budget_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceBudgetPreviewRequest" } } }
      responses:
        "200":
          description: Current and proposed alert-impact projections.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [preview]
                properties: { preview: { $ref: "#/components/schemas/PerformanceBudgetImpactPreview" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/performance/budgets/{budget_id}/recommendations/{recommendation_key}/decision:
    post:
      operationId: decideOperatorPerformanceBudgetRecommendation
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Records an admin's accepted or rejected decision against the exact recommendation snapshot. This operation is audited and never updates the budget, creates an incident, or sends a notification. Reusing the same snapshot key revises the recorded decision while preserving audit history.
      parameters:
        - { name: budget_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: recommendation_key, in: path, required: true, description: Server-generated SHA-256 key binding the budget revision, outcome aggregate, and proposed policy., schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: range, in: query, required: false, description: Must match the range used to generate the recommendation., schema: { type: string, enum: [30d, 90d, 365d], default: 90d } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceBudgetPolicyDecisionRequest" } } }
      responses:
        "200":
          description: Persisted human feedback; budget configuration remains unchanged.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [feedback]
                properties: { feedback: { $ref: "#/components/schemas/PerformanceBudgetPolicyDecision" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/performance/budgets/{budget_id}/effects/{decision_id}/acknowledge:
    post:
      operationId: acknowledgeOperatorPerformanceBudgetEffect
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Records or revises an admin disposition for a currently reviewable regressed effect. The audit event binds the evidence snapshot, application revision, observation window, and rollback parameters. This operation never updates the budget.
      parameters:
        - { name: budget_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: decision_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceBudgetPolicyEffectReviewRequest" } } }
      responses:
        "200":
          description: Effect disposition acknowledged; budget configuration remains unchanged.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [review]
                properties: { review: { $ref: "#/components/schemas/PerformanceBudgetPolicyEffectReview" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/performance/budgets/{budget_id}/effects/{decision_id}/close:
    post:
      operationId: closeOperatorPerformanceBudgetEffect
      tags: [Operations]
      security: [{ operatorBearerAuth: [] }]
      description: Closes an acknowledged effect disposition with an audited reason. Closed dispositions are immutable; this operation never updates or rolls back the budget.
      parameters:
        - { name: budget_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: decision_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PerformanceBudgetPolicyEffectCloseRequest" } } }
      responses:
        "200":
          description: Effect disposition closed; budget configuration remains unchanged.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [review]
                properties: { review: { $ref: "#/components/schemas/PerformanceBudgetPolicyEffectReview" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/ops/configuration/convergence:
